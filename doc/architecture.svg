<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 600" width="1140" height="600" role="img" aria-labelledby="title desc">
  <title id="title">CDP Bridge MCP 系统架构</title>
  <desc id="desc">工作台经 HTTP 发送带 token 的 MCP 请求。服务端通过 FastMCP 和 TMWebDriver 定位同一 token 的浏览器会话；Chrome 扩展在各自 Profile 中执行页面操作并回传结果。单用户可以使用 stdio。</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; }
  </style>
  <rect width="1140" height="600" rx="22" fill="#f8f9fc"/>

<text x="44" y="74" font-size="44" fill="#1c2942" font-weight="720" class="label">CDP Bridge MCP</text>
<text x="46" y="111" font-size="21" fill="#52617a" font-weight="450" class="label">同一个工作台，通过独立连接操作各自已登录的浏览器。</text>
<path d="M44 140 H1096" fill="none" stroke="#d5dce8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="184" font-size="23" fill="#1c2942" font-weight="650" class="label">MCP 客户端</text>
<text x="381" y="184" font-size="23" fill="#1c2942" font-weight="650" class="label">桥接服务</text>
<text x="825" y="184" font-size="23" fill="#1c2942" font-weight="650" class="label">Chrome 浏览器</text>
<rect x="44" y="218" width="257" height="238" rx="13" fill="white" stroke="#d5dce8" />
<path d="M68 249 h23 v17 h-23 z M73 254 l4 4 -4 4 M80 262 h5" fill="none" stroke="#3b58bd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="105" y="266" font-size="25" fill="#1c2942" font-weight="640" class="label">AI 工作台</text>
<path d="M66 286 H279" fill="none" stroke="#d5dce8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="68" y="324" font-size="19" fill="#1c2942" font-weight="600" class="label">连接 A</text>
<text x="68" y="348" font-size="16" fill="#52617a" font-weight="450" class="mono">Bearer token_a</text>
<text x="68" y="407" font-size="19" fill="#1c2942" font-weight="600" class="label">连接 B</text>
<text x="68" y="431" font-size="16" fill="#52617a" font-weight="450" class="mono">Bearer token_b</text>
<path d="M305 326 H376 m-5 -4 5 4 -5 4 M310 322 l-5 4 5 4" fill="none" stroke="#3b58bd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M305 409 H376 m-5 -4 5 4 -5 4 M310 405 l-5 4 5 4" fill="none" stroke="#3b58bd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="381" y="218" width="356" height="238" rx="13" fill="#243652" stroke="none" />
<text x="407" y="254" font-size="26" fill="#ffffff" font-weight="650" class="label">FastMCP</text>
<text x="407" y="281" font-size="18" fill="#cedaf1" font-weight="450" class="label">接收 MCP 工具调用</text>
<path d="M407 300 H710" fill="none" stroke="#546681" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="407" y="334" font-size="20" fill="#e0e9ff" font-weight="550" class="mono">TokenManager</text>
<text x="407" y="359" font-size="17" fill="#d4dded" font-weight="450" class="label">按 token 选择会话上下文</text>
<text x="407" y="403" font-size="20" fill="#e0e9ff" font-weight="550" class="mono">TMWebDriver</text>
<text x="407" y="428" font-size="17" fill="#d4dded" font-weight="450" class="label">定位标签页，分发命令与结果</text>
<path d="M742 272 H820 m-5 -4 5 4 -5 4 M747 268 l-5 4 5 4" fill="none" stroke="#3b58bd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="825" y="218" width="270" height="109" rx="12" fill="white" stroke="#d5dce8" />
<rect x="844" y="239" width="29" height="23" rx="5" fill="#e7ecfc" stroke="none" />
<path d="M851 245 h15 v11 h-15 z M851 248 h15" fill="none" stroke="#3b58bd" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="882" y="258" font-size="22" fill="#1c2942" font-weight="650" class="label">Profile A</text>
<text x="845" y="288" font-size="18" fill="#52617a" font-weight="450" class="label">扩展  ↔  已登录页面</text>
<text x="845" y="314" font-size="15" fill="#3b58bd" font-weight="450" class="mono">token_a</text>
<path d="M742 402 H820 m-5 -4 5 4 -5 4 M747 398 l-5 4 5 4" fill="none" stroke="#3b58bd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="825" y="348" width="270" height="109" rx="12" fill="white" stroke="#d5dce8" />
<rect x="844" y="369" width="29" height="23" rx="5" fill="#e7ecfc" stroke="none" />
<path d="M851 375 h15 v11 h-15 z M851 378 h15" fill="none" stroke="#3b58bd" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="882" y="388" font-size="22" fill="#1c2942" font-weight="650" class="label">Profile B</text>
<text x="845" y="418" font-size="18" fill="#52617a" font-weight="450" class="label">扩展  ↔  已登录页面</text>
<text x="845" y="444" font-size="15" fill="#3b58bd" font-weight="450" class="mono">token_b</text>
<path d="M44 487 H1096" fill="none" stroke="#d5dce8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="44" y="522" font-size="17" fill="#52617a" font-weight="560" class="label">客户端接入</text>
<text x="44" y="552" font-size="19" fill="#1c2942" font-weight="600" class="label">Streamable HTTP（多用户）</text>
<text x="44" y="578" font-size="16" fill="#52617a" font-weight="450" class="label">本机单用户也可使用 stdio</text>
<text x="595" y="522" font-size="17" fill="#52617a" font-weight="560" class="label">扩展连接</text>
<text x="595" y="552" font-size="19" fill="#1c2942" font-weight="600" class="mono">WebSocket  :18765</text>
<text x="595" y="578" font-size="16" fill="#52617a" font-weight="450" class="label">HTTP 备用通道  :18766（默认端口）</text>
</svg>
